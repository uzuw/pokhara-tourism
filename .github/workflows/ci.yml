name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  api:
    name: API tests (functional + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # app.test.js + security.test.js + security-ratelimit.test.js
      - run: npm test
      - name: Production boot smoke test
        run: bash scripts/deploy_check.sh

  web:
    name: Web build + full-stack e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      # Boots API (production mode) + the built Next app and drives the real
      # same-origin paths the browser uses (/api, /assets) plus a user journey.
      - name: End-to-end stack check
        run: bash scripts/e2e_check.sh

  proxy:
    name: Reverse proxy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Starts throwaway upstreams and loads deploy/nginx.conf for real.
      - run: bash scripts/nginx_check.sh

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  api:
    name: API tests (functional + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # app.test.js + security.test.js + security-ratelimit.test.js
      - run: npm test
      - name: Production boot smoke test
        run: bash scripts/deploy_check.sh

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build

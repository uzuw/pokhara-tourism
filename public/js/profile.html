<!DOCTYPE html>
<html lang="en" data-tags="profile, account, pokhara">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · Pokhara Tú</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="nav-placeholder"></div>
  <section class="section" style="padding-top:46px">
    <div class="container">
      <div id="profileArea">
        <div class="profile-head skeleton" style="height:160px"></div>
      </div>
    </div>
  </section>

  <footer class="footer"><div class="container footer-bottom">© 2026 Pokhara Tú · Built with OpenStreetMap & Wikimedia Commons</div></footer>

  <script src="/js/app.js"></script>
  <script>
    PT.mountNav('profile');
    if (!PT.requireLogin()) { /* redirect handled */ }

    async function load() {
      let data;
      try { data = await PT.api('/users/me'); }
      catch { document.getElementById('profileArea').innerHTML = '<p class="muted">Please log in to view your profile.</p>'; return; }
      const { user, myRatings, myComments, stats } = data;
      const initial = (user.username || '?')[0].toUpperCase();

      document.getElementById('profileArea').innerHTML = `
        <div class="profile-head">
          <div class="avatar-lg">${initial}</div>
          <div style="flex:1">
            <h2 style="margin:0;color:var(--lake-800)">${PT.escapeHtml(user.username)}</h2>
            <div class="muted">${PT.escapeHtml(user.email)} · joined ${new Date((user.created_at||'').replace(' ','T')+'Z').toLocaleDateString()}</div>
            <div class="profile-stats">
              <div><div class="n">${stats.ratings_given}</div><div class="l">Ratings</div></div>
              <div><div class="n">${stats.comments_made}</div><div class="l">Reviews</div></div>
            </div>
          </div>
          <button class="btn btn-outline" id="editBtn">Edit profile</button>
        </div>

        <div id="editForm" style="display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:18px 0;box-shadow:var(--shadow-sm)">
          <div class="form-error" id="editErr" style="display:none"></div>
          <div class="field"><label>Username</label><input id="eUsername" value="${PT.escapeHtml(user.username)}"></div>
          <div class="field"><label>Bio</label><textarea id="eBio" rows="3" placeholder="Tell us about your travels…">${PT.escapeHtml(user.bio||'')}</textarea></div>
          <button class="btn btn-primary" id="saveBtn">Save changes</button>
        </div>

        <div class="grid" style="grid-template-columns:1fr 1fr;gap:24px;margin-top:24px;align-items:start">
          <div class="rating-panel">
            <h3 style="margin-top:0;color:var(--lake-800)">⭐ Your ratings</h3>
            <div id="ratingsList">${myRatings.length ? myRatings.map(ratingRow).join('') : '<p class="muted">You haven\'t rated anything yet.</p>'}</div>
          </div>
          <div class="comments-panel">
            <h3 style="margin-top:0;color:var(--lake-800)">💬 Your reviews</h3>
            <div id="commentsList">${myComments.length ? myComments.map(commentRow).join('') : '<p class="muted">No reviews yet.</p>'}</div>
          </div>
        </div>`;

      document.getElementById('editBtn').onclick = () => {
        const f = document.getElementById('editForm');
        f.style.display = f.style.display === 'none' ? 'block' : 'none';
      };
      document.getElementById('saveBtn').onclick = saveProfile;
    }

    function ratingRow(r) {
      return `<div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)">
        <img src="${r.image}" style="width:46px;height:46px;border-radius:10px;object-fit:cover" onerror="this.style.background='linear-gradient(120deg,#0e3a56,#14b8a6)'">
        <div style="flex:1"><a href="/destination.html?slug=${r.slug}" style="font-weight:600;color:var(--lake-800)">${PT.escapeHtml(r.name)}</a><div style="color:#ffb400;font-size:.95rem">${PT.starString(r.score)}</div></div>
      </div>`;
    }
    function commentRow(c) {
      return `<div class="comment"><div class="comment-head"><span class="name">${PT.escapeHtml(c.name)}</span><span class="time">${PT.timeAgo(c.created_at)}</span></div><div class="comment-body">${PT.escapeHtml(c.text)}</div></div>`;
    }

    async function saveProfile() {
      const err = document.getElementById('editErr'); err.style.display = 'none';
      try {
        const r = await PT.api('/users/me', { method: 'PATCH', body: { username: document.getElementById('eUsername').value, bio: document.getElementById('eBio').value } });
        PT.setStoredUser(r.user);
        PT.toast('Profile saved ✨');
        load();
      } catch (e2) { err.textContent = e2.message; err.style.display = 'block'; }
    }

    load();
  </script>
</body>
</html>

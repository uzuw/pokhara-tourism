<!DOCTYPE html>
<html lang="en" data-tags="destinations, list, filter, pokhara">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Destinations · Pokhara Tú</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <section class="section" style="padding-top:48px">
    <div class="container">
      <div class="section-head" style="text-align:left;margin:0 0 26px;max-width:none">
        <span class="eyebrow">🌊 All spots</span>
        <h2 style="margin:8px 0">Where to go in Pokhara</h2>
        <p>Filter by category or search. Click any card to see the map and reviews.</p>
      </div>

      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:26px">
        <input id="search" placeholder="Search lakes, temples, caves…" style="flex:1;min-width:220px;padding:12px 16px;border-radius:999px;border:1.5px solid var(--line);font:inherit;background:#fff" />
        <select id="catFilter" style="padding:12px 16px;border-radius:999px;border:1.5px solid var(--line);font:inherit;background:#fff">
          <option value="">All categories</option>
        </select>
      </div>

      <div class="grid cards" id="grid">
        <div class="skeleton" style="height:330px"></div>
        <div class="skeleton" style="height:330px"></div>
        <div class="skeleton" style="height:330px"></div>
        <div class="skeleton" style="height:330px"></div>
      </div>
      <p id="empty" class="muted center" style="display:none;margin-top:30px">No destinations match your search.</p>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-bottom">© 2026 Pokhara Tú · Map data © OpenStreetMap contributors · Photos via Wikimedia Commons</div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    PT.mountNav('destinations');

    function cardHtml(d) {
      const img = d.image || '/assets/images/phewa-lake.jpg';
      const rating = d.avg_rating > 0 ? `<div class="card-rating">★ ${d.avg_rating.toFixed(1)} <span style="font-size:.7rem;opacity:.8">(${d.rating_count})</span></div>` : '';
      const tags = (d.tags || '').split(',').slice(0,3).map(t => `<span class="tag">${PT.escapeHtml(t.trim())}</span>`).join('');
      return `<a class="card" href="/destination.html?slug=${d.slug}">
        <div class="card-media">
          <img src="${img}" alt="${PT.escapeHtml(d.name)}" loading="lazy" onerror="this.src='/assets/images/phewa-lake.jpg'">
          <div class="card-badge">${PT.escapeHtml(d.category)}</div>${rating}
        </div>
        <div class="card-body">
          <h3>${PT.escapeHtml(d.name)}</h3>
          <p>${PT.escapeHtml(d.short_desc)}</p>
          <div class="card-meta"><div class="tag-row">${tags}</div></div>
        </div>
      </a>`;
    }

    async function loadCategories() {
      try {
        const r = await PT.api('/destinations');
        const cats = [...new Set(r.destinations.map(d => d.category))].sort();
        const sel = document.getElementById('catFilter');
        cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
      } catch {}
    }

    async function load() {
      const q = document.getElementById('search').value.trim();
      const cat = document.getElementById('catFilter').value;
      const params = new URLSearchParams();
      if (q) params.set('q', q);
      if (cat) params.set('category', cat);
      try {
        const r = await PT.api('/destinations?' + params.toString());
        const grid = document.getElementById('grid');
        grid.innerHTML = r.destinations.map(cardHtml).join('') || '';
        document.getElementById('empty').style.display = r.destinations.length ? 'none' : 'block';
      } catch {
        document.getElementById('grid').innerHTML = '<p class="muted">Failed to load.</p>';
      }
    }

    // URL ?cat= preselect
    const urlCat = new URLSearchParams(location.search).get('cat');
    if (urlCat) document.getElementById('catFilter').value = urlCat;

    document.getElementById('search').addEventListener('input', debounce(load, 250));
    document.getElementById('catFilter').addEventListener('change', load);
    function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

    loadCategories().then(load);
  </script>
</body>
</html>

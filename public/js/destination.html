<!DOCTYPE html>
<html lang="en" data-tags="destination, detail, rating, comments, pokhara">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Destination · Pokhara Tú</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div id="nav-placeholder"></div>
  <div id="page"></div>

  <footer class="footer"><div class="container footer-bottom">© 2026 Pokhara Tú · Map data © OpenStreetMap contributors · Photos via Wikimedia Commons</div></footer>

  <script src="/js/app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    PT.mountNav('destinations');
    const slug = new URLSearchParams(location.search).get('slug');
    if (!slug) location.href = '/destinations.html';

    const page = document.getElementById('page');

    async function load() {
      let dest;
      try { dest = (await PT.api('/destinations/' + slug)).destination; }
      catch { page.innerHTML = '<section class="section center"><h2>Destination not found</h2><a class="btn btn-primary" href="/destinations.html">Back to list</a></section>'; return; }

      const img = dest.image || '/assets/images/phewa-lake.jpg';
      page.innerHTML = `
        <header class="detail-hero">
          <img src="${img}" alt="${PT.escapeHtml(dest.name)}" onerror="this.style.display='none'">
          <div class="inner">
            <a href="/destinations.html" style="color:#bcd;font-size:.85rem">← All destinations</a>
            <h1>${PT.escapeHtml(dest.name)}</h1>
            <div class="meta-row">
              <span class="info-chip">📍 ${dest.lat.toFixed(4)}, ${dest.lng.toFixed(4)}</span>
              <span class="info-chip">🎫 ${PT.escapeHtml(dest.entry_fee || 'Free')}</span>
              <span class="info-chip">🕒 ${PT.escapeHtml(dest.best_time || 'Any time')}</span>
              <span class="info-chip">⭐ ${dest.avg_rating > 0 ? dest.avg_rating.toFixed(1) + ' (' + dest.rating_count + ')' : 'No ratings yet'}</span>
            </div>
          </div>
        </header>

        <section class="section">
          <div class="container detail-grid">
            <div>
              <h2 style="color:var(--lake-800);margin-top:0">About ${PT.escapeHtml(dest.name)}</h2>
              <p style="color:var(--ink-soft)">${PT.escapeHtml(dest.description)}</p>
              <div class="tag-row" style="margin:14px 0 24px">${(dest.tags||'').split(',').map(t=>`<span class="tag">${PT.escapeHtml(t.trim())}</span>`).join('')}</div>

              <h3 style="color:var(--lake-800)">📍 How to get there</h3>
              <div id="detailMap"></div>
              <p class="muted" style="font-size:.85rem;margin-top:8px">Open the full map to draw a route from any other spot: <a href="/map.html?slug=${dest.slug}" style="color:var(--lake-600);font-weight:600">Plan your route →</a></p>

              <h3 style="color:var(--lake-800);margin-top:30px">💬 Traveller reviews (${dest.comment_count})</h3>
              <div id="commentArea"></div>
            </div>

            <aside>
              <div class="rating-panel" style="margin-bottom:22px">
                <h3 style="margin-top:0;color:var(--lake-800)">Rate this spot</h3>
                <div class="rating-summary">
                  <div>
                    <div class="big-score" id="avgScore">${dest.avg_rating > 0 ? dest.avg_rating.toFixed(1) : '—'}</div>
                    <div class="muted" id="avgCount" style="font-size:.8rem">${dest.rating_count} rating${dest.rating_count===1?'':'s'}</div>
                  </div>
                  <div class="dist" id="distBox"></div>
                </div>
                <div id="myRatingZone" style="margin-top:18px;border-top:1px solid var(--line);padding-top:16px"></div>
              </div>
            </aside>
          </div>
        </section>`;

      // map
      const m = L.map('detailMap').setView([dest.lat, dest.lng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(m);
      L.marker([dest.lat, dest.lng], { icon: PT.makeIcon(true) }).addTo(m).bindPopup(`<b>${PT.escapeHtml(dest.name)}</b>`);
      setTimeout(() => m.invalidateSize(), 200);

      renderRatingWidget(dest);
      await loadComments(dest);
    }

    function renderRatingWidget(dest) {
      const zone = document.getElementById('myRatingZone');
      const token = PT.getToken();
      if (!token) {
        zone.innerHTML = `<div class="login-prompt"><a href="/login.html?next=${encodeURIComponent(location.pathname+location.search)}">Log in</a> to rate this spot.</div>`;
        loadDistribution(dest);
        return;
      }
      zone.innerHTML = `<div class="muted" style="font-size:.85rem;margin-bottom:6px">Your rating:</div>
        <div class="rating-stars" id="stars"></div>
        <div id="rateMsg" class="muted" style="font-size:.8rem;margin-top:6px"></div>`;
      const stars = document.getElementById('stars');
      let cur = dest.my_rating || 0;
      for (let i = 1; i <= 5; i++) {
        const b = document.createElement('button');
        b.textContent = '★'; if (i <= cur) b.classList.add('active');
        b.onclick = () => submitRating(dest.slug, i);
        b.onmouseenter = () => { for (let k=1;k<=5;k++) stars.children[k-1].classList.toggle('active', k<=i); };
        b.onmouseleave = () => { for (let k=1;k<=5;k++) stars.children[k-1].classList.toggle('active', k<=cur); };
        stars.appendChild(b);
      }
      loadDistribution(dest);
    }

    async function submitRating(slug, score) {
      try {
        const r = await PT.api('/destinations/' + slug + '/ratings', { method: 'POST', body: { score } });
        document.getElementById('avgScore').textContent = r.avg.toFixed(1);
        document.getElementById('avgCount').textContent = r.rating_count + ' ratings';
        PT.toast('Thanks for rating! ⭐');
        // refresh distribution + my rating state
        const dest = (await PT.api('/destinations/' + slug)).destination;
        renderRatingWidget(dest);
      } catch (e) { PT.toast(e.message); }
    }

    async function loadDistribution(dest) {
      try {
        const r = await PT.api('/destinations/' + dest.slug + '/ratings');
        const box = document.getElementById('distBox');
        if (!box) return;
        const max = Math.max(1, ...Object.values(r.distribution));
        box.innerHTML = [5,4,3,2,1].map(s => {
          const c = r.distribution[s] || 0;
          const pct = Math.round((c / max) * 100);
          return `<div class="dist-row">${s}★ <div class="dist-bar"><span style="width:${pct}%"></span></div> ${c}</div>`;
        }).join('');
      } catch {}
    }

    async function loadComments(dest) {
      const area = document.getElementById('commentArea');
      let list;
      try { list = (await PT.api('/destinations/' + dest.slug + '/comments')).comments; }
      catch { area.innerHTML = '<p class="muted">Could not load comments.</p>'; return; }

      const token = PT.getToken();
      const user = PT.getStoredUser();
      const formHtml = token
        ? `<div class="rating-panel" style="margin-bottom:18px">
             <textarea id="cText" rows="3" placeholder="Share your experience…" style="width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);font:inherit;resize:vertical"></textarea>
             <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn btn-primary" id="postBtn">Post review</button></div>
           </div>`
        : `<div class="login-prompt" style="margin-bottom:18px"><a href="/login.html?next=${encodeURIComponent(location.pathname+location.search)}">Log in</a> to leave a review.</div>`;

      area.innerHTML = formHtml + `<div id="commentList">${list.length ? list.map(commentHtml).join('') : '<p class="muted">Be the first to review this spot.</p>'}</div>`;

      if (token) {
        document.getElementById('postBtn').onclick = async () => {
          const t = document.getElementById('cText').value.trim();
          if (t.length < 2) { PT.toast('Write a little more'); return; }
          try {
            const r = await PT.api('/destinations/' + dest.slug + '/comments', { method: 'POST', body: { text: t } });
            const listEl = document.getElementById('commentList');
            if (listEl.querySelector('p')) listEl.innerHTML = '';
            listEl.insertAdjacentHTML('afterbegin', commentHtml(r.comment));
            document.getElementById('cText').value = '';
            PT.toast('Review posted 💬');
          } catch (e) { PT.toast(e.message); }
        };
      }
    }

    function commentHtml(c) {
      const initial = (c.username || '?')[0].toUpperCase();
      const canDelete = PT.getStoredUser() && (PT.getStoredUser().username === c.username);
      return `<div class="comment" data-id="${c.id}">
        <div class="comment-head">
          <span class="avatar-sm">${initial}</span>
          <span class="name">${PT.escapeHtml(c.username)}</span>
          <span class="time">${PT.timeAgo(c.created_at)}</span>
          ${canDelete ? `<button class="del" onclick="deleteComment(${c.id})">delete</button>` : ''}
        </div>
        <div class="comment-body">${PT.escapeHtml(c.text)}</div>
      </div>`;
    }

    window.deleteComment = async function(id) {
      if (!confirm('Delete this review?')) return;
      try {
        await PT.api('/comments/' + id, { method: 'DELETE' });
        document.querySelector(`.comment[data-id="${id}"]`)?.remove();
        PT.toast('Review deleted');
      } catch (e) { PT.toast(e.message); }
    };

    load();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-tags="register, signup, auth, pokhara">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · Pokhara Tú</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand" style="margin-bottom:18px"><span class="logo">🌊</span> Pokhara <span style="color:var(--teal-500)">Tú</span></div>
      <h1>Create your account</h1>
      <p class="sub">Free forever. Rate spots, write reviews, build your log.</p>
      <div class="form-error" id="err"></div>
      <form id="form">
        <div class="field">
          <label>Username</label>
          <input name="username" type="text" required minlength="3" autocomplete="username" placeholder="traveler_01" />
        </div>
        <div class="field">
          <label>Email</label>
          <input name="email" type="email" required autocomplete="email" placeholder="you@email.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="at least 6 characters" />
          <div class="hint">Use 6+ characters. We hash it — we never see it.</div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Create account</button>
      </form>
      <div class="auth-switch">Already have an account? <a href="/login.html">Log in</a></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    PT.mountNav();
    if (PT.getToken()) location.href = '/profile.html';
    const next = new URLSearchParams(location.search).get('next') || '/profile.html';

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err'); err.style.display = 'none';
      const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating…';
      try {
        const r = await PT.api('/auth/register', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) });
        PT.setToken(r.token); PT.setStoredUser(r.user);
        PT.toast('Welcome to Pokhara Tú ✨');
        location.href = next;
      } catch (e2) {
        err.textContent = e2.message; err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>

# Hamro Pokhara — reverse proxy (nginx).
#
# One origin for everything:
#   /            -> Next.js web app
#   /api/*       -> Express API
#   /assets/*    -> Express image host (long-cached)
#
# TLS: terminate here with certbot (`certbot --nginx`) or swap this file for the
# Caddy equivalent in deploy/Caddyfile.example.
upstream pokhara_api { server api:4000; }
upstream pokhara_web { server web:3000; }

# gzip at the edge keeps the Node event loop free for JSON work.
gzip on;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 5;

server {
    listen 80;
    server_name _;

    # Security headers for the HTML app. (The API sets its own via helmet.)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Let the API's batched logger see truthful client addresses:
    proxy_set_header X-Request-Id $request_id;

    # --- API ---
    location /api/ {
        proxy_pass http://pokhara_api;
        proxy_read_timeout 30s;
    }

    # --- destination photos ---
    location /assets/ {
        proxy_pass http://pokhara_api;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # --- Next.js ---
    location / {
        proxy_pass http://pokhara_web;
        proxy_read_timeout 60s;
    }
}
